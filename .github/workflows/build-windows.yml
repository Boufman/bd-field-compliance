name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo files
        run: dir /s /b
        shell: cmd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        shell: powershell
        run: |
          pyinstaller --onefile --console --name BD_Field_Compliance `
            --paths . `
            --add-data "backend;backend" `
            --hidden-import parser `
            --hidden-import reporting `
            --hidden-import pdf_builder `
            --hidden-import openpyxl `
            --hidden-import reportlab `
            run_report.py

      - uses: actions/upload-artifact@v4
        with:
          name: BD_Field_Compliance
          path: dist/BD_Field_Compliance.exe
