name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - run: |
          pyinstaller --onefile --console --name BD_Field_Compliance ^
            --paths . ^
            --hidden-import uvicorn ^
            --hidden-import uvicorn.logging ^
            --hidden-import uvicorn.loops.auto ^
            --hidden-import uvicorn.protocols.http.auto ^
            --hidden-import uvicorn.protocols.websockets.auto ^
            --hidden-import uvicorn.lifespan.on ^
            --hidden-import backend.config ^
            --hidden-import backend.app ^
            --hidden-import backend.analysis_engine.parser ^
            --hidden-import backend.analysis_engine.reporting ^
            --hidden-import backend.pdf_engine.pdf_builder ^
            run_server.py
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: BD_Field_Compliance
          path: dist/BD_Field_Compliance.exe
